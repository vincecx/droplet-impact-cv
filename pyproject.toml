[project]
name = "droplet-impact-cv"
version = "0.3.0"
description = "Automated image analysis for side-view high-speed droplet impact sequences"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "imagecodecs>=2025.3.30",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "opencv-python>=4.13.0.92",
    "scipy>=1.15.3",
    "tifffile>=2025.5.10",
]

[project.scripts]
droplet-impact-cv = "droplet_impact_cv.cli:main"
droplet-impact-cv-gui = "droplet_impact_cv.gui:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.setuptools.packages.find]
include = ["droplet_impact_cv*"]
